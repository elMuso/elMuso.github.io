baseurl      = "https://elmuso.github.io"
title        = "El Muso"
 canonifyurls = true
languageCode = "en-us"
defaultContentLanguage = "es"
defaultContentLanguageInSubdir= true
enableRobotsTXT = true
theme = "localtheme"
publishDir = "docs"
collaborators = []

[taxonomies]
# Disable the default taxonomies
tag = "tags"
category = "cat"

[params]
  authorName = "El Muso"
  customCSS = ["/style.css"]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"
  enableThemeToggle = true
  # Set disableReadOtherPosts to true in order to hide the links to other posts.
  disableReadOtherPosts = false
  # Enable sharing buttons, if you like
  enableSharingButtons = true
  EnableGlobalLanguageMenu = true
  # Metadata mostly used in document's head
  description = "My new homepage or blog"
  keywords = "homepage, blog"
  images = [""]
  [params.favicon.color]
    mask = "#101010"
    msapplication = "#101010"
    theme = "#101010"
[languages]
  [languages.es]
  languageCode = "es"
  title = "El Muso - Blog de Teoría Musical con material gratuito (y legal)"
  [languages.es.params]
  homeSubtitle = "¡Bienvenido a mi blog! Aqui publico una serie de contenidos que surgieron por el deseo de tener una distribución justa, y equitativa, de la enseñanza y cultura musical. Gran parte esta hecha en español... por ahora"
  homedownloadprompt = "Para descargar cada contenido, haz click sobre el"
  subtitle = "Preservación y enseñanza musical"
  keywords = "blog teoría musical gratis gratuita pdf libro clases musica avanzada armonia"
  copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
  readOtherPosts = "Más publicaciones"
  main=[
      {name="Información/Contacto",url="/es/about"},
      {name="Licencias",url="/es/licenses"},
      {name="Inicio",url="/es/"}
      # {name="Colaboradores",url="/helpers"},
  ]
  downloads=[
    {name="Ecos Tradicionales de Bolivia [PDF]",url="https://github.com/elMuso/EcosTradicionalesDeBolivia/raw/main/Ecos%20Tradicionales%20de%20Bolivia%20(alta%20calidad).pdf"},
    {name="El ABC de la teoría musical 1 [PDF]",url="https://github.com/elMuso/ElABCTeoriaMusical/raw/main/El%20ABC%20de%20la%20Teor%C3%ADa%20musical%201.pdf"},
    {name="El ABC de la teoría musical 2 [PDF]",url="https://github.com/elMuso/ElABCTeoriaMusical/raw/main/El%20ABC%20de%20la%20Teor%C3%ADa%20Musical%202.pdf"},
    {name="Ejercicios de teoría musical [PDF]",url="https://github.com/elMuso/ElABCTeoriaMusical/raw/main/CUADERNO%20DE%20EJERCICIOS.pdf"},
    {name="De Obras Bolivianas [PDF]",url="https://github.com/elMuso/DeObrasBolivianas/raw/main/De%20Obras%20Bolivianas.pdf"},
    ]
    [languages.es.params.logo]
    logoText = "ElMuso.github.io"
    logoHomeLink = "/"

  [languages.en]
  title = "ElMuso - Music Theory blog with free (and legal) material"
  [languages.en.params]
    homeSubtitle = "¡Welcome to my blog! Here i publish a group of content that was made by the desire of having a fair and equal distribution of musical knowledge and cuture. Some of it is only in spanish... for now"
    homedownloadprompt = "To download the content, just click it"
    subtitle = "Musical preservation and teaching"
    keywords = "blog music theory free pdf book class music advanced harmony"
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
    readOtherPosts = "Other posts"
    main=[
      {name="About us/Contact",url="/en/about"},
      {name="Licences",url="/en/licenses"},
      {name="Home",url="/en/"}
      # {name="Collaborators",url="/helpers"},
    ]
    downloads=[
    {name="Traditional Echoes of Bolivia [PDF][EN]",url="https://github.com/elMuso/EcosTradicionalesDeBolivia/raw/main/Ecos%20Tradicionales%20de%20Bolivia%20(alta%20calidad).pdf"},
    {name="El ABC de la teoría musical 1 [PDF][ES]",url="https://github.com/elMuso/ElABCTeoriaMusical/raw/main/El%20ABC%20de%20la%20Teor%C3%ADa%20musical%201.pdf"},
    {name="El ABC de la teoría musical 2 [PDF][ES]",url="https://github.com/elMuso/ElABCTeoriaMusical/raw/main/El%20ABC%20de%20la%20Teor%C3%ADa%20Musical%202.pdf"},
    {name="Music theory exercises [PDF][ES]",url="https://github.com/elMuso/ElABCTeoriaMusical/raw/main/CUADERNO%20DE%20EJERCICIOS.pdf"},
